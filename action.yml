name: "skillcheck"
description: "Cross-agent skill quality gate for SKILL.md files. Validates against the agentskills.io specification."
author: "Brad Kinnard (moonrunnerkc), Aftermath Technologies Ltd"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  path:
    description: "Path to a SKILL.md file or directory to scan recursively."
    required: false
    default: "."
  version:
    description: "skillcheck version to install (e.g., '1.2.3'). Leave empty for latest."
    required: false
    default: ""
  min-desc-score:
    description: "Minimum description quality score (0-100). Below this triggers a warning."
    required: false
    default: ""
  target-agent:
    description: "Scope compat checks: claude, vscode, cursor, or all (default: all)."
    required: false
    default: ""
  strict-vscode:
    description: "Promote VS Code compat issues to errors."
    required: false
    default: "false"
  strict-cursor:
    description: "Promote Cursor compat issues to errors."
    required: false
    default: "false"
  strict:
    description: "Strict mode. Escalates warnings to exit 1 and enables --strict-vscode and --strict-cursor."
    required: false
    default: "false"
  skip-dirname-check:
    description: "Skip directory-name matching check."
    required: false
    default: "false"
  skip-ref-check:
    description: "Skip file reference validation."
    required: false
    default: "false"
  ignore:
    description: "Comma-separated rule prefixes to suppress (e.g., 'sizing,disclosure')."
    required: false
    default: ""
  max-lines:
    description: "Override the line-count threshold (default: 500)."
    required: false
    default: ""
  max-tokens:
    description: "Override the token-count threshold (default: 8000)."
    required: false
    default: ""
  format:
    description: "Output format. Defaults to github for automatic PR annotations."
    required: false
    default: "github"
  semantic:
    description: "Enable semantic-adjacent validation. In standalone CI this enables heuristic graph analysis."
    required: false
    default: "false"
  analyze-graph:
    description: "Run heuristic capability graph analyzers and merge diagnostics into the report."
    required: false
    default: "false"
  ingest-critique:
    description: "Path to an agent self-critique JSON response to ingest."
    required: false
    default: ""
  critique-agent:
    description: "Critique prompt/source agent: claude, codex, or cursor."
    required: false
    default: ""
  ingest-graph:
    description: "Path to an agent graph-extraction JSON response to ingest."
    required: false
    default: ""
  graph-agent:
    description: "Graph prompt/source agent: claude, codex, or cursor."
    required: false
    default: ""
  history:
    description: "Append a validation record to .skillcheck-history.json."
    required: false
    default: "false"
  activation-hypotheses:
    description: "Generate activation hypotheses. This is an emit mode and does not produce PR annotations."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ">=3.10"

    - name: Install and run skillcheck
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install --quiet "skillcheck==${{ inputs.version }}"
        else
          pip install --quiet "skillcheck>=1.0.1"
        fi

        args=()
        args+=("${{ inputs.path }}")
        args+=("--format" "${{ inputs.format }}")

        [ "${{ inputs.strict-vscode }}" = "true" ] && args+=("--strict-vscode")
        [ "${{ inputs.strict-cursor }}" = "true" ] && args+=("--strict-cursor")
        [ "${{ inputs.strict }}" = "true" ] && args+=("--strict")
        [ "${{ inputs.skip-dirname-check }}" = "true" ] && args+=("--skip-dirname-check")
        [ "${{ inputs.skip-ref-check }}" = "true" ] && args+=("--skip-ref-check")
        [ "${{ inputs.semantic }}" = "true" ] && args+=("--semantic")
        [ "${{ inputs.analyze-graph }}" = "true" ] && args+=("--analyze-graph")
        [ "${{ inputs.history }}" = "true" ] && args+=("--history")
        [ "${{ inputs.activation-hypotheses }}" = "true" ] && args+=("--activation-hypotheses")
        [ -n "${{ inputs.min-desc-score }}" ] && args+=("--min-desc-score" "${{ inputs.min-desc-score }}")
        [ -n "${{ inputs.target-agent }}" ] && args+=("--target-agent" "${{ inputs.target-agent }}")
        [ -n "${{ inputs.max-lines }}" ] && args+=("--max-lines" "${{ inputs.max-lines }}")
        [ -n "${{ inputs.max-tokens }}" ] && args+=("--max-tokens" "${{ inputs.max-tokens }}")
        [ -n "${{ inputs.ingest-critique }}" ] && args+=("--ingest-critique" "${{ inputs.ingest-critique }}")
        [ -n "${{ inputs.critique-agent }}" ] && args+=("--critique-agent" "${{ inputs.critique-agent }}")
        [ -n "${{ inputs.ingest-graph }}" ] && args+=("--ingest-graph" "${{ inputs.ingest-graph }}")
        [ -n "${{ inputs.graph-agent }}" ] && args+=("--graph-agent" "${{ inputs.graph-agent }}")
        IFS=',' read -ra PREFIXES <<< "${{ inputs.ignore }}"
        for p in "${PREFIXES[@]}"; do
          [ -n "$p" ] && args+=("--ignore" "$(echo "$p" | xargs)")
        done

        skillcheck "${args[@]}"