[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skillcheck"
version = "1.5.0"
description = "Cross-agent skill quality gate for SKILL.md files conforming to the agentskills.io specification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Brad Kinnard" },
    { name = "Aftermath Technologies Ltd" },
]
dependencies = [
    "pyyaml>=6.0",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]
tiktoken = [
    "tiktoken>=0.7",
]

[project.scripts]
skillcheck = "skillcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Measurement is on by default so a plain `pytest` still reports coverage. The
# --cov-fail-under=80 floor is NOT here: addopts applies to every invocation,
# including `pytest tests/test_sizing.py`, where whole-package coverage is
# meaningless and the run fails at 0%. The floor lives with the full-suite
# callers instead, in `make test`, `make verify-release`, and the CI test job.
#
# The floor sits well under measured coverage so it survives matrix variance.
# Measured 90% on CPython 3.10 once subprocess tracing was enabled. The sources
# of variance are the tomllib vs fallback-parser branch that only executes below
# 3.11, a few tests that skip on Windows, and the tiktoken branch, which CI does
# not install. 80 also holds if subprocess tracing fails outright on some
# platform, which would drop measurement back to roughly 82.
addopts = "--cov=skillcheck --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line-length in unchangeable string literals (JSON fixtures, base64, schema text)

[tool.mypy]
strict = true
python_version = "3.10"
# The whole scripts/ directory, not a per-file list: an allowlist silently
# leaves the next script ungated, which is what ruff already avoids by taking
# the directory.
files = ["src/skillcheck", "scripts"]

[[tool.mypy.overrides]]
# tiktoken ships no type stubs; tomllib has no typeshed stubs under the pinned
# python_version (3.10), where it is the optional 3.11+ stdlib backport branch.
module = ["tiktoken", "tomllib"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["skillcheck"]
# The CLI tests invoke `python -m skillcheck` as a real subprocess, which is
# deliberate: it is the only way to assert exit codes and stdout as a user sees
# them. Those subprocesses were invisible to the tracer, which is why cli.py and
# commands.py measured near zero while being the most exercised code in the
# suite. parallel = true makes each subprocess write its own data file, which
# pytest-cov combines at the end; tests/conftest.py sets COVERAGE_PROCESS_START
# so the interpreter starts coverage before importing skillcheck.
#
# __main__.py is no longer omitted: with subprocess tracing it genuinely runs.
parallel = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
