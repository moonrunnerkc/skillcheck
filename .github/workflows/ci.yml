name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check (all modules)
        run: python -m compileall -q src/skillcheck

  package:
    runs-on: ubuntu-latest
    # Attestation steps below need to issue an OIDC token and write the
    # attestation; both default to off in the workflow-level permissions
    # block. Job-scoped overrides keep the rest of the workflow read-only.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling

      - name: Build sdist and wheel
        run: python -m hatchling build

      - name: Verify wheel installs
        run: |
          pip install dist/skillcheck-*.whl
          skillcheck --version

      - name: Attest build provenance
        # Only attest tagged releases. Attestations on every CI run would
        # flood the project's attestation feed and are not signed against
        # an intended release artifact.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/skillcheck-*.whl
            dist/skillcheck-*.tar.gz
